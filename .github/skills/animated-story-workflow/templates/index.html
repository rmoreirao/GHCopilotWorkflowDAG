<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>REPLACE_WITH_ORIGINAL_STORY_TITLE</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#story">Skip to story</a>
  <header>
    <h1>REPLACE_WITH_ORIGINAL_STORY_TITLE</h1>
  </header>
  <main id="story" tabindex="-1">
    <section id="scene-stage" aria-live="polite" aria-label="Story scene"></section>
    <nav aria-label="Story controls">
      <button id="previous-scene" type="button">Previous</button>
      <p id="scene-status" role="status"></p>
      <button id="next-scene" type="button">Next</button>
      <button id="sound-toggle" type="button" aria-pressed="false">Sound off</button>
    </nav>
    <details>
      <summary>Read the transcript</summary>
      <div id="transcript"></div>
    </details>
  </main>
</body>
</html>
